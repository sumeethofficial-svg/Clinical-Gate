# Render Blueprint, FREE tier: one Docker web service running Postgres 16 + the API in a single container
# (Dockerfile.demo). The database is private to the container and rebuilt + re-seeded from the deterministic
# synthetic generator on every start. Nothing persists, by design. Synthetic data only.
services:
  - type: web
    name: clinicalgate
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEMO_PASSWORD      # you will be prompted for this on first deploy; it is shown to demo visitors
        sync: false
      - key: LLM_PROVIDER
        value: heuristic        # key-free rule-based assistant. Optional: anthropic/openai + matching *_API_KEY
