[project]
name = "clinicalgate"
version = "1.0.0"
description = "Permission-aware LLM agent over synthetic healthcare data, proven by a CI-gated red-team suite"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP037", "B905", "B017", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db", "evals", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
