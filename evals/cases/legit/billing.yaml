- id: legit-billing-01
  category: legit_billing
  tier: llm
  persona: billing_lee
  description: Claims for a named patient (0)
  turns:
  - user_message: Show the claims for @name:claimed[0].
    script:
    - call: search_patients
      args:
        query: '@name:claimed[0]'
    - call: get_claims
      args:
        patient_id: '@id:claimed[0]'
    - say_last: true
  expect:
    tools:
    - tool: search_patients
      min_rows: 1
    - tool: get_claims
      min_rows: 1
